---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.6
serverless_language: node
refresh_interval_floor: ''
polling_url: 'https://metaforge.app/api/arc-raiders/events-schedule?region={{ region | default: ''europe'' }}'
polling_headers: 'Accept: application/json'
polling_body: ''
id: 542750
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: region
  field_type: select
  name: Matchmaking region
  description: Choose the region you play in to see its map condition schedule.
  options:
  - Europe: europe
  - North America: north-america
  - Brazil: brazil
  - East Asia: east-asia
  - Oceania: oceania
  default: europe
- keyname: bio
  field_type: author_bio
  name: About This Plugin
  category: games
  github_url: https://github.com/taichikuji/trmnl-arc-raiders-plugin
  learn_more_url: https://github.com/taichikuji/trmnl-arc-raiders-plugin/tree/main/TRMNL#setup
  description: >-
    Plan your next run in ARC Raiders with a glance at current and upcoming map conditions.
    The screen shows which events are active now, what starts next and when each condition
    begins or ends. <br/><br/> Choose the matchmaking region that matches your game sessions:
    Europe, North America, Brazil, East Asia or Oceania. Start and end times follow your TRMNL
    account time zone, and compact layouts put active events first so you can recognize the
    current situation quickly. <br/><br/> The schedule is provided by MetaForge, while event
    symbols and logo artwork come from the official ARC Raiders map conditions page.
    <br/><br/> No game account or API key is required. This is an unofficial community recipe
    and is not affiliated with Embark Studios or MetaForge. Created by Ivan Perez.
name: ARC Raiders
description: ARC Raiders map events and times
refresh_interval: 15
