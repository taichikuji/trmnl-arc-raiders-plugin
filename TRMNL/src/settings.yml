---
strategy: polling
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.6
serverless_language: node
refresh_interval_floor: ''
polling_url: 'https://metaforge.app/api/arc-raiders/events-schedule?region={{ region | default: ''europe'' }}'
polling_headers: 'Accept: application/json'
polling_body: ''
id: 542750
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: region
  field_type: select
  name: Matchmaking region
  description: Choose the region you play in to see its map condition schedule.
  options:
  - Europe: europe
  - North America: north-america
  - Brazil: brazil
  - East Asia: east-asia
  - Oceania: oceania
  default: europe
- keyname: bio
  field_type: author_bio
  name: About This Plugin
  category: games
  github_url: https://github.com/taichikuji/trmnl-arc-raiders-plugin
  learn_more_url: https://github.com/taichikuji/trmnl-arc-raiders-plugin/tree/main/TRMNL#setup
  description: >-
    See which ARC Raiders map conditions are active and what starts next in your
    matchmaking region. Times follow your TRMNL account time zone.
    No game account or API key required.
    <br/><br/>This is an unofficial community recipe. Schedule data comes from
    <a href="https://metaforge.app/arc-raiders" class="underline">MetaForge</a>.
    The logo and event symbols come from the
    <a href="https://arcraiders.com/map-conditions" class="underline">ARC Raiders Map Conditions page</a>.
name: ARC Raiders
description: Unofficial map condition rotation
refresh_interval: 30
